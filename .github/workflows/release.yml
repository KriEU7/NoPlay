name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            ext: .exe
          - name: linux-x64
            os: ubuntu-latest
            ext: ""
          - name: macos-arm64
            os: macos-latest
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Stesso tag che la release job pubblicherà: l'auto-update (update.rs)
      # lo confronta con quello dell'ultima release per sapere se è aggiornato.
      - name: Compute release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            tag="dev"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${{ github.ref_name }}"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            tag="v${version}-build.${{ github.run_number }}"
          fi
          echo "NOPLAY_RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dir="noplay-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/noplay${{ matrix.ext }}" config.example.json README.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir"
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: noplay-${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "name=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build checksums file
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          rm dist/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
