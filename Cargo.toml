[package]
name = "noplay"
version = "0.1.0"
edition = "2021"
description = "Parental control trasparente: blocca i videogiochi sul PC e si gestisce via Telegram"

[dependencies]
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
sysinfo = "0.33"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
pretty_env_logger = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
